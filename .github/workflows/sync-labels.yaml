name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master 2026-10-20
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
