name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to add to the manifest (e.g. v12.4.0.0)'
        required: true

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      # The manifest lives on master, so update it there (not on the tag, which master may have moved past).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0

      # Release text and tag names reach the script only through the environment, never pasted into it, so
      # quotes, backticks or $(...) in release notes are data, not shell.
      - name: Update Manifest
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${TAG}" ]; then
            echo "::error::No release tag given"
            exit 1
          fi

          # The release must exist and be published; its notes are the manifest changelog.
          RELEASE=$(gh release view "${TAG}" --repo "${REPO}" --json tagName,isDraft,body)
          if [ "$(echo "${RELEASE}" | jq -r '.isDraft')" = "true" ]; then
            echo "::error::${TAG} is still a draft"
            exit 1
          fi
          CHANGELOG=$(echo "${RELEASE}" | jq -r '.body' | tr -d '`')

          # Version and ABI come from build.yaml as it was at the tag.
          git fetch --tags --force
          BUILD_YAML=$(git show "${TAG}:build.yaml")
          VERSION=$(echo "${BUILD_YAML}" | sed -nE 's/^version: *"?([^"]*)"?.*/\1/p')
          TARGET_ABI=$(echo "${BUILD_YAML}" | sed -nE 's/^targetAbi: *"?([^"]*)"?.*/\1/p')
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match build.yaml version ${VERSION}"
            exit 1
          fi

          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          ZIP="jellyfin-plugin-livechannels-${VERSION}.zip"

          # Always checksum the zip actually being published; -f makes a missing asset fail the job instead of
          # checksumming a 404 page. A published .md5 must agree with it.
          curl -fsSL -o "${RUNNER_TEMP}/${ZIP}" "${BASE}/${ZIP}"
          CHECKSUM=$(md5sum "${RUNNER_TEMP}/${ZIP}" | cut -d' ' -f1)
          if PUBLISHED=$(curl -fsSL "${BASE}/${ZIP}.md5" 2>/dev/null); then
            PUBLISHED=$(echo "${PUBLISHED}" | awk '{print $1}')
            if [ "${PUBLISHED}" != "${CHECKSUM}" ]; then
              echo "::error::${ZIP}.md5 (${PUBLISHED}) does not match the zip (${CHECKSUM})"
              exit 1
            fi
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Version ${VERSION}, ABI ${TARGET_ABI}, checksum ${CHECKSUM}"

          NEW_VERSION=$(jq -n \
            --arg version "${VERSION}" \
            --arg changelog "${CHANGELOG}" \
            --arg targetAbi "${TARGET_ABI}" \
            --arg sourceUrl "${BASE}/${ZIP}" \
            --arg checksum "${CHECKSUM}" \
            --arg timestamp "${TIMESTAMP}" \
            '{version: $version, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp}')

          # Re-running for a version already listed replaces its entry rather than adding a duplicate.
          jq --argjson entry "${NEW_VERSION}" \
            '.[0].versions = [$entry] + (.[0].versions | map(select(.version != $entry.version)))' \
            manifest.json > manifest_temp.json
          mv manifest_temp.json manifest.json

      - name: Commit Changes
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifest.json
          git commit -m "Update manifest for release ${TAG}" || exit 0
          git push origin HEAD:master
