<div id="LiveChannelsSessionsPage" data-role="page"
     class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button"
     data-controller="__plugin/livechannels_sessions.js">
    <div data-role="content">
        <div class="content-primary">
            <!-- The form has nothing to submit; it is here because Jellyfin's dashboard styles size a page's form to
                 the standard content width, and every other tab is laid out inside one. -->
            <form id="LiveChannelsSessionsForm" onsubmit="return false;">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Sessions</h1>
                    </div>

                    <div class="fieldDescription">
                        Every channel encoding on the server, with how fast it transcodes, where 1.0x keeps up with realtime. Select a session to read or copy its ffmpeg log, or to kill the stream.
                    </div>

                    <div id="sessionsEmpty" class="base-empty-section hidden">No channels are streaming right now.</div>

                    <div id="sessionList" class="lc-session-list"></div>

                    <span id="sessionsStatus" class="base-status-text"></span>

                </div>
            </form>
        </div>
    </div>

    <style>
        /* lc-session-list */
        /* The stack of session cards. */
        /* Example: <div class="lc-session-list"><div class="base-record-card lc-session">...</div></div> */
        .lc-session-list { display: flex; flex-direction: column; gap: var(--base-gap-narrow); margin-top: var(--base-gap-narrow); }

        /* lc-session */
        /* A session card that opens its ffmpeg log, with the channel logo and name over its rows. */
        /* Example: <div class="base-record-card lc-session"><div class="lc-session-head"><img class="lc-session-logo" /></div></div> */
        .lc-session { cursor: pointer; transition: border-color 0.15s; }
        .lc-session:hover { border-color: var(--base-accent); }
        .lc-session.lc-winding { opacity: 0.6; }
        .lc-session-head { display: flex; align-items: center; gap: var(--base-gap-narrow); margin-bottom: var(--base-gap-narrow); }
        .lc-session-logo { width: 3.5rem; height: 3.5rem; border-radius: var(--base-radius-large); object-fit: cover; flex: 0 0 auto; background: var(--base-wash); }
        .lc-session-logo.lc-pending { visibility: hidden; }
        .lc-session-title { flex: 1; min-width: 0; }
        .lc-session-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lc-session-number { opacity: 0.55; margin-right: var(--base-gap-narrow); }
        .lc-session-stopping { color: var(--base-orange-fg); font-size: 0.82em; margin-top: 2px; }
        .lc-speed { display: inline-flex; align-items: center; gap: var(--base-gap-narrow); }
    </style>

    <link rel="stylesheet" href="configurationpage?name=livechannels_jpkribs_shared.css">
</div>
