overview: "Build looping virtual TV channels that appear natively in Jellyfin's Live TV."
description: >
  Live Channels turns your own library into looping virtual TV channels that play natively in
  Jellyfin's Live TV. The channels, their guide, and their streams are all served inside Jellyfin
  itself, so they appear automatically with no tuner to add, no URLs to paste, and no exposed endpoints.
category: "LiveTV"
imageUrl: "https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-livechannels/refs/heads/master/Jellyfin.Plugin.LiveChannels/Assets/Logo.png"
owner: "JPKribs"
artifacts:
- "Jellyfin.Plugin.LiveChannels.dll"
changelog:
  features:
  - Placeholder blocks take a channel off air for a time window, showing one program in the guide (named "-" unless you name it) and looping a 10 second card with your message
  - Ten silent card styles that loop without a seam - Default, Static, Error, Ocean, Night sky, Lava lamp, Rain, Embers, Aurora, and Custom (your own image, GIF or video)
  - The card's message can name when the channel resumes and what it resumes with ({time} and {contentName}), and changes with every airing without rendering again
  - Placeholder cards render with the other buffer cards, only for channels that have a placeholder block, and again after you save one
