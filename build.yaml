- "Jellyfin.Plugin.LiveChannels.dll"
changelog:
  features:
  - Series recordings honour Keep up to (removing only their own oldest recordings) and Record new episodes only
  - An item whose encoder fails partway resumes where it stopped instead of skipping to the next item
  - Burned-in subtitles follow your default language, and audio tagged as undetermined no longer counts as foreign
  - The Popular channel only airs titles that every Live TV user is allowed to see
  fixed:
  - Items with an external audio file (a separate dub) no longer play silent
  - A channel whose encoder keeps failing no longer restarts it forever while a viewer stays tuned in
  - Series recordings keep recording the show they were created for after the schedule changes
  - Saving plugin settings no longer reshuffles every channel's guide, and saves that do rebuild it keep the program on air
  - Changing the codec or resolution while someone is watching no longer breaks their stream
  - Picture subtitles (PGS) on cropped Blu-ray encodes are no longer cut off
  - Phone videos recorded upright no longer play sideways with Intel hardware decoding
  - Software HEVC keeps its segments evenly sized
  - Intel QSV on Windows no longer fails every item before retrying in software
  - Storage that stops answering now shows standby instead of a frozen picture
  - A stream whose output closes now stops cleanly instead of filling the failure reports
  - Removing stale guide programs is much lighter on Jellyfin's database
  - GIF channel logos now appear on the tune-in card
  - Several smaller fixes to timing, cleanup and shutdown
