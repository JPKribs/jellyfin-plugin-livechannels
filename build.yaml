changelog:
  features:
  - The Up Next card shows what airs after it, and when, on a smaller Then line
  - The Up Next card shows a movie's poster, and a landscape image for episodes, music videos and home videos
  - Hardware decoding follows Jellyfin's own settings (the codecs ticked for hardware decoding, and the 10-bit and range extension HEVC switches), so a file the GPU cannot decode goes straight to software instead of failing first
  fixed:
  - Tune-in cards no longer fail to render on Intel QSV
  - Rendering tune-in and Up Next cards no longer makes playing channels stutter
