changelog:
  fixed:
  - The arrows on collapsible sections are back to their usual size
  changed:
  - The dashboard pages take their look from JPKribs.Jellyfin.Base 2026.11.17, with its buttons, cards, and count cards
  - Sources, rating blocks, and placeholder blocks are cards with their own Add and close buttons, and each card shows only the fields its choices use
  - Rating blocks and placeholder blocks sit in their own lists, and a maximum age rating below the minimum is marked on the card before the channel saves
  - Whitelist and Blacklist sources pick shows, movies, and single episodes from a library search with artwork
  - The logo is picked with an image picker that crops it to a square and shows the generated logo while nothing is uploaded
  - Minimum Community Rating, Minimum Critic Rating, and subtitle Size are sliders
  - Subtitle Text Color and Outline Color use a color picker, with As Authored keeping each subtitle's own color
  - Each page saves from a save bar that shows unsaved changes and why a save stopped
  - Sessions are media rows with the channel logo, a speed badge, and a No viewers countdown badge
  - Stress test rounds show Passed or Failed badges, and the recommendation sits in a box with an Apply button
  - Labels use Title Case
  - Studios, People, Audio language, Default language, and the genre lists pick values with a typeahead that shows each choice as a removable chip
  - Drop-down fields use Jellyfin's own select style
  - The stress test picks its test item from a library search that shows each result's artwork
  - The ffmpeg log of a session opens in a log viewer with Copy All
  developer:
  - Uses JPKribs.Jellyfin.Base 2026.11.17, whose AtomicFile replaces the local AtomicFiles and the hand written temp file writes for logos and fonts
  - The pages use Base's Chip Select, Media Picker, Log Viewer, Repeater, Image Picker, Slider Field, Color Picker, Inherit Field, Save Bar, Media Card, List, Definition List, Banner, and count cards in place of hand built pickers, chips, item rows, block cards, session cards, a log dialog, and status text
  - The rating and placeholder block Repeaters are shared by the Channels and Popular pages in livechannels_placeholder.js
  - Adds starthere.md, agent.md, and the guides in skills, and removes SETTINGS.md, which only pointed at the docs
