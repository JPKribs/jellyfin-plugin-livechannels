changelog:
  features:
  - Tune-in and Up Next cards are 10 seconds, and the tune-in card counts down to the channel
  - New Generate Buffer Cards scheduled task (Live TV) renders every channel's tune-in card and the shared part of its Up Next cards ahead of time, at start-up and after Reset schedule, so tuning in never waits on a render
  - Reset schedule rebuilds the guide and every channel's buffer cards from scratch
  - Encoding follows more of Jellyfin's settings (encoder preset, thread count, deinterlacing method and Intel low-power encoding)
  - The next item is prepared ahead of each boundary, so slow or sleeping storage no longer stalls the transition
  fixed:
  - Up Next cards render about twice as fast, and no longer need ffprobe
  - An Up Next card whose following item is unknown leaves its Then line empty instead of showing black
