changelog:
  features:
  - An "Up Next" card plays for 15 seconds before each item, showing its artwork, title, episode and rating (on by default, per channel)
  - The Up Next card and the tune-in card play a soft chord that fades in and trails off
  - Schedules and learned item lengths now live in Jellyfin's data folder, so clearing the cache no longer moves what is on air
  fixed:
  - Tune-in cards, logos, fonts and ffmpeg's working files all live in the plugin's stream folder, and nothing is written to the system temp folder
