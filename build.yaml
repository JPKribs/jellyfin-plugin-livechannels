changelog:
  fixed:
  - A viewer who tuned in and left without closing the stream, such as by quitting the app while it buffered, stayed in Jellyfin's list of open live streams until the server restarted. Jellyfin is told to close the stream when the viewer is released
  - While a network share stayed unreachable, every standby retry left one more server thread waiting on it, which could slow the whole server. At most four wait at a time, and checks start again once the share answers
  developer:
  - LiveChannelsTvService takes IMediaSourceManager and closes the stream of every viewer it releases itself through CloseInJellyfinAsync
  - StorageProbe counts the timed-out checks still waiting across every probe, and takes its own count in a test
